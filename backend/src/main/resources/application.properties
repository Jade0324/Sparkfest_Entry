spring.application.name=sparkfest

spring.datasource.url=jdbc:mysql://localhost:3306/sparkfest_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=davidromero04
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=8080


# Disable open-in-view warning
spring.jpa.open-in-view=false

# Disable Spring Security auto password (since we use SecurityConfig)
spring.security.user.name=disabled
spring.security.user.password=disabled